name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"], paths: [".github/workflows/metrics.yml"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Drbrilliant360
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Dar_es_Salaam
          config_display: columns
          config_animations: yes
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar, languages, lines, calendar, followup

          # 3D contributions calendar, streak and commits per day
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_languages_ignored: html, css

          # Lines of code added and removed
          plugin_lines: yes

          # Flat calendar for the current year
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Issues and pull requests, open against closed
          plugin_followup: yes
          plugin_followup_sections: user

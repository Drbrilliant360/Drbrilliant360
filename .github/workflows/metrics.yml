name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"], paths: [".github/workflows/metrics.yml"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Drbrilliant360
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Dar_es_Salaam
          config_display: columns
          config_animations: yes
          config_order: base.header, base.activity, base.community, base.repositories, isocalendar, habits, languages, topics, achievements

          # 3D contributions calendar, streak and commits per day
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Commit activity per hour and per day, language activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Most used languages bar
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css

          # Technology icons, taken from the topics of repositories you starred
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 30

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

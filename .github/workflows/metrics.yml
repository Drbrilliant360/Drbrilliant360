name: Metrics
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"], paths: [".github/workflows/metrics.yml"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Left card: profile, activity, languages, issues and pull requests
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Drbrilliant360
          filename: metrics.base.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Dar_es_Salaam
          config_animations: yes
          plugin_languages: yes
          plugin_followup: yes
          plugin_followup_sections: user

      # Right card: 3D contributions calendar and the yearly calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Drbrilliant360
          filename: metrics.calendar.svg
          template: classic
          base: ""
          config_timezone: Africa/Dar_es_Salaam
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_calendar: yes
          plugin_calendar_limit: 1
